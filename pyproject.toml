[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigacan"
version = "0.1.0"
description = "YouTube audio pipeline and local Qwen ASR transcription."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
transcribe = "gigacan.qwen_srt.cli:main"

[dependency-groups]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
